<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漏洞详情 - 漏洞发布平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c7000b'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff'%3E漏%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css" />

  <!-- 1. esm-x 必须最先（阻塞式）：在 es-module-shims 初始化前设置 shimMode -->
  <script id="esm-x" compiler="babel" loading="circular" src="./vendor/esm-x.js"></script>

  <!-- 2. importmap：react 全家桶映射到本地 ESM 构建 -->
  <script type="importmap">
  {
    "imports": {
      "react": "./vendor/react.js",
      "react-dom": "./vendor/react-dom.js",
      "react-dom/client": "./vendor/react-dom-client.js",
      "scheduler": "./vendor/scheduler.js"
    }
  }
  </script>

  <!-- 3. ES Module Shims -->
  <script async src="./vendor/es-module-shims.js"></script>
</head>
<body>
  <!-- 页面2：漏洞详情（版式参考 trust.mi.com 通告页） -->
  <div id="root"></div>

  <!-- 4. 内联入口：esm-x 只读 innerHTML，禁止 src 外链写法（实测静默空白）
       mount 文件只做挂载，根素材为 detail.jsx -->
  <script type="esm-x">
    import './detail.mount.jsx';
  </script>
</body>
</html>
